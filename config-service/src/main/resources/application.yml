spring:
  application:
    name: config-service
  cloud:
    discovery:
      enabled: true
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
server:
  port: 9999
management:
  endpoints:
    jmx:
      exposure:
        include: health,info
